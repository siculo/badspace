  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 1900px; padding: 16px 24px; background: var(--bg); color: var(--fg);

  h1 { font-size: 28px; margin: 0 0 4px; flex-shrink: 0; }

  main > p { margin: 4px 0 8px; max-height: 3em; overflow: auto; flex-shrink: 0; }
  .muted { color: var(--muted); }
  .controls { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px;
              padding: 12px; margin-top: 8px; background: var(--card);
              border: 1px solid var(--line); border-radius: 10px;
              max-height: 20dvh; overflow: auto; flex-shrink: 0; }
  .controls label { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
  select { font: inherit; color: inherit; background: var(--bg); border: 1px solid #496173;
           border-radius: 5px; padding: 8px; min-width: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0;
            max-height: 15dvh; overflow: auto; flex-shrink: 0; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px;
            vertical-align: -1px; }
  /* The comparison fills the space left in the window, but not below its minimum height:
     in a lower window the page scrolls. */
  .comparison { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
                grid-template-rows: minmax(0, 1fr); gap: 20px; flex: 1 1 0; min-height: 360px; }
  .legend label { cursor: pointer; display: flex; align-items: center; gap: 4px; overflow-wrap: anywhere; min-width: 0; }
  .legend input { accent-color: var(--fg); }
  .legend label:has(input:not(:checked)) { opacity: 0.55; }
  .table-wrap th:first-child { white-space: normal; min-width: 160px; max-width: 280px; overflow-wrap: anywhere; }
  figure { margin: 0; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  figcaption { font-weight: 600; margin-bottom: 4px; }
  figure > p { margin: 4px 0 0; font-size: 12px; }
  svg { display: block; width: 100%; height: 100%; flex: 1; min-height: 0; }
  svg text { fill: var(--muted); font-size: 14px; }
  svg .grid { stroke: var(--line); stroke-width: 1; }
  .table-wrap { overflow: auto; min-width: 0; min-height: 0; padding: 20px;
                background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 8px; vertical-align: top; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .better { color: var(--better); }
  .worse { color: var(--worse); }
  .ratio { font-size: 12px; margin-left: 4px; }
  /* On a narrow screen all does not fit in the window: the page scrolls, the chart keeps
     its proportions and the other parts have their natural height. */
  @media (max-width: 1000px) {
    body { display: block; padding: 12px 16px; }
    main { display: block; }
    #runs, main > p, .legend, .controls { max-height: none; }
    .controls { position: static; }
    .controls label { flex-wrap: wrap; }
    select { max-width: 100%; }
    .comparison { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 8px; min-height: 0; }
    figure { padding: 12px; }
    svg { height: auto; flex: none; aspect-ratio: 900 / 560; }
    .table-wrap { overflow-x: auto; overflow-y: visible; padding: 12px; }
  }
</style>

  load: PERSISTENCE + 'loadPartition() of a save into a new partition: read, checks, rebuild of the storage and of the index, ' +

const COLORS = ['#94d8ff', '#ffb078', '#71d69a', '#ff92bd', '#b9a1ff', '#a9d9dd', '#f2d479', '#c7d2df'];

const unique = values => [...new Set(values)];

/** Draws a log-log line chart with one line for each series. */
function chart(lines, unitLabel) {
  const W = 900, H = 560, L = 80, R = 24, T = 38, B = 48;
  const points = lines.flatMap(l => l.points);
  if (points.length === 0) return '<p class="muted">No data</p>';
  const logs = (values, pad) => {
    let lo = Math.floor(Math.log10(Math.min(...values))), hi = Math.ceil(Math.log10(Math.max(...values)));
    if (lo === hi) { lo -= pad; hi += pad; }
    return [lo, hi];
  };
  const [x0, x1] = logs(points.map(p => p[0]), 1);
  const [y0, y1] = logs(points.map(p => p[1]), 1);
  const sx = x => L + (Math.log10(x) - x0) / (x1 - x0) * (W - L - R);
  const sy = y => H - B - (Math.log10(y) - y0) / (y1 - y0) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Results by number of entities, logarithmic axes">`;
  for (let e = y0; e <= y1; e++) {
    const y = sy(10 ** e);
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>`;
    svg += `<text x="${L - 4}" y="${y + 3}" text-anchor="end">${esc(cell(10 ** e, unitLabel))}</text>`;
  }
  for (let e = x0; e <= x1; e++) {
    const x = sx(10 ** e);
    svg += `<line class="grid" x1="${x}" x2="${x}" y1="${T}" y2="${H - B}"/>`;
    svg += `<text x="${x}" y="${H - B + 13}" text-anchor="middle">${fmtSize(10 ** e)}</text>`;
  }
  svg += `<text x="${W - R}" y="${H - 2}" text-anchor="end">entities</text>`;
  svg += `<text x="2" y="${T - 10}">${esc(unitName(unitLabel))}</text>`;
  for (const l of lines) {
    const pts = l.points.map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${l.color}" stroke-width="2"/>`;
    for (const [x, y] of l.points) {

}

function renderSection(op) {
  const all = rows.filter(r => r.op === op && (r.params.distribution || '') === state.distribution);
  const matching = all.filter(r => selected(r) && value(r) !== undefined);
  const availableSeries = series.filter(s => matching.some(r => r.series === s));
  const visible = availableSeries.filter(s => !state.hidden.has(s));
  const data = matching.filter(r => visible.includes(r.series));
  const used = unique(all.flatMap(r => Object.keys(r.params))).filter(n => !AXES.includes(n));
  const subtitle = used.map(n => `${n} = ${state.filters[n]}`).join(', ');
  document.getElementById('legend').innerHTML = availableSeries.map(s =>
    `<label><input type="checkbox" data-series="${esc(s)}" ${state.hidden.has(s) ? '' : 'checked'}>` +
    `<span class="swatch" style="background:${color(s)}"></span>${esc(s)}</label>`).join('');
  document.querySelectorAll('[data-series]').forEach(el => el.addEventListener('change', () => {
    if (el.checked) state.hidden.delete(el.dataset.series);
    else state.hidden.add(el.dataset.series);
    render();
  }));
  let html = `<h2>${esc(TITLES[op] || op)} · ${esc(state.distribution || 'Not specified')}</h2>` +
    `<p class="muted">${esc(subtitle || 'no other parameters')}` +
    `${state.metric !== 'mean' && !matching.some(r => r.mode === 'sample') ? ' · mean only' : ''}</p>` +
    (DESCRIPTIONS[op] ? `<p class="muted">${esc(DESCRIPTIONS[op])}</p>` : '');
  if (matching.length === 0) return html + '<p class="muted">No data for these filters.</p>';
  if (data.length === 0) return html + '<p class="muted">All solutions are hidden. Select a solution above to show its results.</p>';
  const unitLabel = unit(data[0]);
  const sizes = numericSort(unique(data.map(r => Number(r.params.size))));
  const find = (s, n) => data.find(r => r.series === s && Number(r.params.size) === n);
  const lines = visible.map(s => ({
    name: s, color: color(s),
    points: sizes.map(n => [n, find(s, n)]).filter(([, r]) => r)
      .map(([n, r]) => [n, value(r)]).filter(([x, y]) => x > 0 && y > 0 && Number.isFinite(y))
  }));
  html += `<div class="comparison"><figure><figcaption>${esc(unitName(unitLabel))} by number of entities</figcaption>` +
    chart(lines, unitLabel) + '<p class="muted">Both axes use a logarithmic scale. Hover over a point for its value.</p></figure>';
  html += `<div class="table-wrap"><table><caption>Values in ${esc(unitName(unitLabel))}, lower is better</caption>` +
    `<thead><tr><th scope="col">Solution / entities</th>` +
    sizes.map(n => `<th scope="col">${fmtSize(n)}</th>`).join('') + '</tr></thead><tbody>';
  for (const s of visible) {
    html += `<tr><th scope="row"><span class="swatch" style="background:${color(s)}"></span>${esc(s)}</th>`;
    for (const n of sizes) {
      const r = find(s, n);
      if (!r) { html += '<td class="muted">–</td>'; continue; }
      const v = value(r);
      const base = find(state.baseline, n);
      const baseValue = base && value(base);
      let ratio = '';
      if (s !== state.baseline && baseValue) {
        const q = v / baseValue;
        const cls = q < 0.9 ? 'better' : q > 1.1 ? 'worse' : 'muted';
        ratio = `<span class="ratio ${cls}">×${q.toFixed(2)}</span>`;
      }
      const samples = r.mode === 'footprint' && r.metric.rawData?.[0]?.length > 1
        ? ` title="Samples: ${esc(r.metric.rawData[0].map(x => withUnit(x, unitLabel)).join(', '))}"` : '';
      html += `<td${samples}>${esc(cell(v, unitLabel))}${ratio}</td>`;
    }
    html += '</tr>';
  }
  return html + '</tbody></table><p class="muted">Ratios are against the selected visible baseline.</p></div></div>';
}

function render() {
  renderControls();
  document.getElementById('sections').innerHTML = renderSection(state.operation);
}

const first = RUNS.flatMap(r => r.results).find(r => r.jdkVersion);
document.getElementById('runs').textContent = RUNS.map(r => `${r.label} (${r.results.length} results)`).join(' · ') +
  (first ? ` · JDK ${first.jdkVersion}, ${first.vmName}` : '');
render();
</script>
</body>
</html>
